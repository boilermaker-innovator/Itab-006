<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- ── OG / Social Metadata ── -->
    <meta name="description" content="Live recap of the Claude Code Meetup Perth, March 2026. Three speakers including Aidan Morgan (Bankwest) on Agentic SDLC and Vanessa Ennis on Claude Code for non-developers. Built from screenshots taken in the room using Claude.">

    <!-- Canonical -->
    <link rel="canonical" href="https://boilermaker-innovator.github.io/using-Claude/">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #111118;
            --bg-tertiary: #1a1a26;
            --text-primary: #ffffff;
            --text-secondary: #8888aa;
            --accent: #7c3aed;
            --accent2: #06b6d4;
            --i-button: #f59e0b;
            --transition: 0.25s ease;
        }
        html, body { height: 100%; overflow: hidden; background: var(--bg-primary); }
        body { font-family: 'DM Sans', sans-serif; color: var(--text-primary); line-height: 1.5; }
        .container { max-width: 430px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; position: relative; }

        .progress-container { display: flex; gap: 4px; padding: 14px 18px 10px; position: absolute; top: 0; left: 0; right: 0; z-index: 100; background: linear-gradient(to bottom, rgba(10,10,15,0.95) 60%, transparent); }
        .progress-segment { flex: 1; height: 3px; background: rgba(255,255,255,0.12); border-radius: 2px; transition: background var(--transition); }
        .progress-segment.viewed { background: rgba(255,255,255,0.4); }
        .progress-segment.active { background: var(--accent); box-shadow: 0 0 8px rgba(124,58,237,0.6); }

        .cards-wrapper { flex: 1; position: relative; overflow: hidden; }
        .card { position: absolute; inset: 0; display: flex; flex-direction: column; opacity: 0; transform: translateX(100%) scale(0.97); transition: all 0.35s cubic-bezier(0.4,0,0.2,1); pointer-events: none; }
        .card.active { opacity: 1; transform: translateX(0) scale(1); pointer-events: all; }
        .card.prev { opacity: 0; transform: translateX(-100%) scale(0.97); }

        .card-hero { padding: 56px 22px 22px; min-height: 38%; display: flex; flex-direction: column; justify-content: flex-end; position: relative; overflow: hidden; }
        .hero-default { background: linear-gradient(145deg, #1a2035 0%, #0a0f1e 100%); }
        .hero-purple  { background: linear-gradient(145deg, #3b1f7a 0%, #1a1040 100%); }
        .hero-cyan    { background: linear-gradient(145deg, #0e3d5c 0%, #071e30 100%); }
        .hero-amber   { background: linear-gradient(145deg, #5c2d0a 0%, #2a1005 100%); }
        .hero-green   { background: linear-gradient(145deg, #0f3d22 0%, #051810 100%); }
        .hero-red     { background: linear-gradient(145deg, #5c1515 0%, #280808 100%); }

        .card-hero::before { content: ''; position: absolute; width: 220px; height: 220px; border-radius: 50%; opacity: 0.22; top: -50px; right: -50px; filter: blur(65px); }
        .hero-purple::before  { background: #7c3aed; }
        .hero-cyan::before    { background: #06b6d4; }
        .hero-amber::before   { background: #f59e0b; }
        .hero-green::before   { background: #10b981; }
        .hero-red::before     { background: #ef4444; }
        .hero-default::before { background: #475569; }

        .card-tag { font-size: 10px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 10px; position: relative; z-index: 1; }
        .tag-purple { color: #a78bfa; } .tag-cyan { color: #67e8f9; } .tag-amber { color: #fcd34d; } .tag-green { color: #6ee7b7; } .tag-red { color: #fca5a5; }

        .card-headline { font-family: 'Syne', sans-serif; font-size: clamp(22px, 5.5vw, 28px); font-weight: 700; line-height: 1.2; letter-spacing: -0.02em; position: relative; z-index: 1; }
        .hero-default em { color: #94a3b8; font-style: normal; }
        .hero-purple  em { color: #c4b5fd; font-style: normal; }
        .hero-cyan    em { color: #67e8f9; font-style: normal; }
        .hero-amber   em { color: #fcd34d; font-style: normal; }
        .hero-green   em { color: #6ee7b7; font-style: normal; }
        .hero-red     em { color: #fca5a5; font-style: normal; }

        .card-body { flex: 1; background: var(--bg-secondary); padding: 20px 22px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
        .card-body::-webkit-scrollbar { width: 3px; }
        .card-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
        .card-summary { font-size: 14.5px; color: var(--text-secondary); line-height: 1.75; }

        .analogy-box { background: var(--bg-tertiary); border-radius: 14px; padding: 14px 16px; border-left: 3px solid var(--accent2); }
        .analogy-title { font-size: 9px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent2); margin-bottom: 7px; }
        .analogy-text { font-size: 13px; color: var(--text-secondary); line-height: 1.65; }

        .i-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
        .i-button { display: flex; align-items: center; gap: 7px; background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.25); border-radius: 22px; padding: 7px 13px; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; color: #fbbf24; cursor: pointer; transition: all var(--transition); }
        .i-button:hover { background: rgba(245,158,11,0.15); border-color: rgba(245,158,11,0.45); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(245,158,11,0.15); }
        .i-dot { width: 17px; height: 17px; background: #f59e0b; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #000; flex-shrink: 0; box-shadow: 0 0 8px rgba(245,158,11,0.4); }

        .nav-area { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px 14px; background: var(--bg-secondary); border-top: 1px solid rgba(255,255,255,0.05); }
        .nav-btn { width: 42px; height: 42px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; color: var(--text-primary); font-size: 17px; cursor: pointer; transition: all var(--transition); display: flex; align-items: center; justify-content: center; }
        .nav-btn:hover:not(:disabled) { background: rgba(255,255,255,0.1); }
        .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }
        .card-counter { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 600; color: var(--text-secondary); letter-spacing: 0.05em; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); backdrop-filter: blur(4px); display: flex; align-items: flex-end; justify-content: center; z-index: 200; opacity: 0; pointer-events: none; transition: opacity var(--transition); }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-sheet { width: 100%; max-width: 430px; background: #16162a; border-radius: 22px 22px 0 0; padding: 22px 22px 32px; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); border-top: 1px solid rgba(255,255,255,0.07); }
        .modal-overlay.active .modal-sheet { transform: translateY(0); }
        .modal-handle { width: 36px; height: 4px; background: rgba(255,255,255,0.15); border-radius: 2px; margin: 0 auto 18px; }
        .modal-term { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; margin-bottom: 4px; }
        .modal-type { font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--i-button); margin-bottom: 14px; }
        .modal-content { font-size: 14px; color: var(--text-secondary); line-height: 1.75; }
        .modal-close { margin-top: 22px; width: 100%; padding: 13px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; color: var(--text-primary); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; }
        .modal-close:hover { background: rgba(255,255,255,0.1); }
    </style>
</head>
<body>
<div class="container">
    <div class="progress-container" id="progress"></div>
    <div class="cards-wrapper" id="cardsWrapper"></div>
    <div class="nav-area">
        <button class="nav-btn" id="prevBtn" onclick="navigate(-1)">←</button>
        <span class="card-counter" id="counter">1 / N</span>
        <button class="nav-btn" id="nextBtn" onclick="navigate(1)">→</button>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
    <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-term" id="modalTerm"></div>
        <div class="modal-type" id="modalType"></div>
        <div class="modal-content" id="modalContent"></div>
        <button class="modal-close" onclick="closeModal()">Close</button>
    </div>
</div>

<script>
const cards = [
    {
        tag: "01 / TONIGHT 🏢", tagClass: "",
        headline: "AI That <em>Builds Itself</em> — Spacecubed Perth",
        heroClass: "hero-default",
        summary: "Claude Code Meetup Perth, March 2026. Aidan Morgan (Bankwest) on Agentic SDLC. Vanessa Ennis on Claude Code for non-developers. This recap was built live from screenshots taken in the room using Claude.",
        analogy: null,
        iButtons: [{ label: "Built how?", type: "context", term: "How This Was Made", content: "Screenshots taken during each talk were fed to Claude in real time. Content was captured, structured, and assembled into this interactive summary on the spot — start to finish during the event. That's iTabs in action." }]
    },
    {
        tag: "02 / AIDAN MORGAN 🏦", tagClass: "tag-purple",
        headline: "Three <em>Loops</em> — Get Out of the Way",
        heroClass: "hero-purple",
        summary: "Aidan's framework from Bankwest: Inner Loop (AI writes and tests code autonomously), Middle Loop (quality gates keep it honest), Outer Loop (integration and release). Size tasks to ~4 hours of human dev work. Design the factory once — then let it run.",
        analogy: { title: "Think of it like...", text: "A production line with automated quality checkpoints. Design it once — step back." },
        iButtons: [
            { label: "Inner Loop", type: "definition", term: "Inner Loop", content: "Write Test → Write Code → Run Tests. Fully automated. The AI iterates without human involvement. As the slide said directly: you aren't needed in this loop." },
            { label: "Task sizing", type: "why-it-matters", term: "~4 Hour Tasks", content: "Tasks sized to ~4 hours of human dev work give the AI a bounded scope. Too big and it drifts. Too small and you lose efficiency. A deliberate constraint that keeps the loop tight." }
        ]
    },
    {
        tag: "03 / AIDAN MORGAN ⚡", tagClass: "tag-cyan",
        headline: "<em>Backpressure</em> — the Signal That Keeps It Honest",
        heroClass: "hero-cyan",
        summary: "The Middle Loop creates backpressure — a fast automated signal the LLM is going wrong so it self-corrects. Cannot come from a human (too slow). Must be binary: good or bad, no grey zone. semgrep detects AI slop. ast-grep blocks bad code structures.",
        analogy: null,
        iButtons: [
            { label: "semgrep", type: "definition", term: "semgrep", content: "Scans the codebase for issues beyond syntax — TODO stubs, repeated strings that should be Enums, empty exception handlers, and AI slop patterns (lazy shortcuts LLMs habitually take)." },
            { label: "JBGE", type: "definition", term: "JBGE", content: "Just Barely Good Enough. Accept JBGE and block the LLM's ability to judge or ignore a problem. Remove subjectivity from the quality gate entirely. Binary only." }
        ]
    },
    {
        tag: "04 / AIDAN MORGAN 🔄", tagClass: "tag-cyan",
        headline: "Horizontal <em>Layers</em> Beat Vertical Slices",
        heroClass: "hero-cyan",
        summary: "Forget thin vertical slices — wrong model for agentic builds. Use horizontal layers with sub-agents specialised per layer, each with a focused system prompt. MEMORY.md handles context rot. With 1M context windows, drift before compaction is now the bigger risk.",
        analogy: null,
        iButtons: [
            { label: "Context rot", type: "definition", term: "Context Rot", content: "As LLM sessions grow, earlier instructions become less reliable and the model drifts. MEMORY.md re-injects key context at the start of each session to compensate." },
            { label: "TDD rethink", type: "why-it-matters", term: "TDD for LLMs", content: "TDD was a teaching tool for humans learning testable code. LLMs already know this — so TDD is not required. Testing is still critical. Pyramid becomes a rhombus: more integration and property tests." }
        ]
    },
    {
        tag: "05 / VANESSA ENNIS 💡", tagClass: "tag-green",
        headline: "Claude Code Is a <em>Working Differently</em> Tool",
        heroClass: "hero-green",
        summary: "Vanessa's reframe as a non-technical PM: stop thinking developer-first. Her stack: Claude for user stories → Lovable for rapid prototyping → Cursor for plans → Claude Code for the full build. Build claude.md first. Treat every output as a first draft.",
        analogy: null,
        iButtons: [
            { label: "claude.md", type: "definition", term: "claude.md", content: "A markdown file giving Claude Code persistent project context — goals, constraints, tech stack, decisions made. Referenced throughout the build. Create this before writing a single line of code." },
            { label: "3 power prompts", type: "why-it-matters", term: "Genius-Level Prompts", content: "From Sabrina Ramonov: (1) Ask clarifying questions until you are 95% confident. (2) What would a top 0.1% person in this field think? (3) Reframe this to challenge how I see the problem." }
        ]
    },
    {
        tag: "06 / VANESSA ENNIS 🚀", tagClass: "tag-green",
        headline: "Built a Real App — <em>No Developer</em>, No Sprint",
        heroClass: "hero-green",
        summary: "Vanessa built Golden Hour — habits, finance, exercise dashboard — solo as a non-technical PM. No developer. No sprint. Shipped in hours. Used Claude for code review: not to read every line, but to ask the right questions. Real confidence, not just trust.",
        analogy: null,
        iButtons: [{ label: "Key lessons", type: "why-it-matters", term: "Vanessa's Lessons", content: "Start earlier than you think. Pursue personal projects — less pressure to experiment. Build claude.md first. Treat outputs as first drafts and always push further. AI makes mistakes: build in checks." }]
    },
    {
        tag: "07 / ITABS LESSONS 🛠️", tagClass: "tag-amber",
        headline: "What Tonight Means for <em>iTabs Dev</em>",
        heroClass: "hero-amber",
        summary: "iTabs already runs an inner loop — email brief → Claude builds widget → deploys to GitHub Pages. SKILL.md is the equivalent of MEMORY.md. But two things are missing: backpressure before deploy, and a split prompt architecture.",
        analogy: { title: "Honest audit...", text: "Already doing: inner loop, context injection, treating outputs as drafts. Missing: binary quality gate, split prompt modules." },
        iButtons: [
            { label: "Missing: backpressure", type: "why-it-matters", term: "No Quality Gate Yet", content: "Claude output currently goes straight to GitHub deploy with no check. A Make.com filter checking for Web3Forms key, card structure, and no placeholder text is a real backpressure gate. 20 minutes to build." },
            { label: "Missing: split prompts", type: "why-it-matters", term: "One Prompt Does Too Much", content: "One Claude prompt currently reads the brief, designs cards, writes copy, and builds HTML. Splitting into Brief Interpreter (JSON out) and Builder (HTML from JSON) means cleaner output and easier debugging." }
        ]
    },
    {
        tag: "08 / NEXT ACTIONS ✅", tagClass: "tag-green",
        headline: "Three <em>Next Actions</em> From Tonight",
        heroClass: "hero-green",
        summary: "Small targeted improvements that tighten the loop and make every iTabs widget build more reliable. Not big projects — focused upgrades to an already-working pipeline.",
        analogy: null,
        iButtons: [
            { label: "Action 1 🎯", type: "definition", term: "Add Backpressure Gate", content: "Make.com filter between Claude output and GitHub deploy. Check HTML contains Web3Forms key, at least 3 card objects, no lorem ipsum. Fail and flag rather than deploying a broken widget." },
            { label: "Action 2 🎯", type: "definition", term: "Split the Build Prompt", content: "Module 1: reads tradie email, outputs structured JSON (name, services, suburb, theme). Module 2: takes JSON, builds widget HTML. Cleaner, more debuggable, better quality." },
            { label: "Action 3 🎯", type: "definition", term: "Prompt Injection Guard", content: "Before going public with build@itabs.ai, strip instruction-like patterns from the brief before passing to Claude. A crafted email could otherwise try to override the system prompt." }
        ]
    },
    {
        tag: "09 / BIG PICTURE 🌱", tagClass: "tag-purple",
        headline: "The Loop Gets Tighter. <em>So Does the Edge.</em>",
        heroClass: "hero-purple",
        summary: "Both talks pointed the same direction: the winners aren't the best coders — they're the people who design the loops, write the guardrails, and let the AI run. A boilermaker building AI tools for tradies from a Spacecubed meetup is exactly that story.",
        analogy: { title: "The shift in one line...", text: "From: 'I need a developer.' To: 'I need a good brief and a tight loop.'" },
        iButtons: [{ label: "iTabs is already there", type: "why-it-matters", term: "Validation", content: "The Make.com pipeline IS an agentic inner loop. SKILL.md IS a MEMORY.md. The $290 one-off model IS treating outputs as first drafts. Tonight wasn't a lesson in what to build — it was validation the approach is right." }]
    }
];

let currentCard = 0;
const totalCards = cards.length;

function init() {
    const progress = document.getElementById('progress');
    const wrapper = document.getElementById('cardsWrapper');
    cards.forEach((card, i) => {
        const seg = document.createElement('div');
        seg.className = 'progress-segment' + (i === 0 ? ' active' : '');
        progress.appendChild(seg);
        wrapper.appendChild(buildCard(card, i));
    });
    document.getElementById('counter').textContent = `1 / ${totalCards}`;
    document.getElementById('prevBtn').disabled = true;
    document.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight') navigate(1);
        if (e.key === 'ArrowLeft') navigate(-1);
        if (e.key === 'Escape') closeModal();
    });
    let startX = 0;
    const cw = document.getElementById('cardsWrapper');
    cw.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
    cw.addEventListener('touchend', e => {
        const diff = startX - e.changedTouches[0].clientX;
        if (Math.abs(diff) > 50) navigate(diff > 0 ? 1 : -1);
    });
}

function buildCard(card, index) {
    const el = document.createElement('div');
    el.className = 'card' + (index === 0 ? ' active' : '');
    const analogyHTML = card.analogy ? `<div class="analogy-box"><div class="analogy-title">${card.analogy.title}</div><div class="analogy-text">${card.analogy.text}</div></div>` : '';
    const iButtonsHTML = card.iButtons.length ? `<div class="i-buttons">${card.iButtons.map(b => `<button class="i-button" data-term="${b.term}" data-type="${b.type}" data-content="${encodeURIComponent(b.content)}"><span class="i-dot">i</span>${b.label}</button>`).join('')}</div>` : '';
    el.innerHTML = `
        <div class="card-hero ${card.heroClass}">
            <div class="card-tag ${card.tagClass}">${card.tag}</div>
            <h2 class="card-headline">${card.headline}</h2>
        </div>
        <div class="card-body">
            <p class="card-summary">${card.summary}</p>
            ${analogyHTML}
            ${iButtonsHTML}
        </div>`;
    el.querySelectorAll('.i-button').forEach(btn => {
        btn.addEventListener('click', e => {
            e.stopPropagation();
            openModal(btn.dataset.term, btn.dataset.type, decodeURIComponent(btn.dataset.content));
        });
    });
    return el;
}

function navigate(dir) {
    const next = currentCard + dir;
    if (next >= 0 && next < totalCards) updateCard(next);
}

function updateCard(index) {
    document.querySelectorAll('.card').forEach((c, i) => {
        c.classList.remove('active', 'prev');
        if (i === index) c.classList.add('active');
        else if (i < index) c.classList.add('prev');
    });
    document.querySelectorAll('.progress-segment').forEach((s, i) => {
        s.classList.remove('active', 'viewed');
        if (i === index) s.classList.add('active');
        else if (i < index) s.classList.add('viewed');
    });
    currentCard = index;
    document.getElementById('counter').textContent = `${index + 1} / ${totalCards}`;
    document.getElementById('prevBtn').disabled = index === 0;
    document.getElementById('nextBtn').disabled = index === totalCards - 1;
}

function openModal(term, type, content) {
    const labels = { 'definition': 'Definition', 'context': 'Context', 'why-it-matters': 'Why It Matters', 'related': 'Related' };
    document.getElementById('modalTerm').textContent = term;
    document.getElementById('modalType').textContent = labels[type] || type;
    document.getElementById('modalContent').textContent = content;
    document.getElementById('modalOverlay').classList.add('active');
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }
init();
</script>
</body>
</html>
